name: Test Suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 架构守卫是独立作业：它必须能在完整测试套件之外单独判定通过与否，
  # 失败即阻断合并。守卫只做 AST/文本静态检查，不装 channel 可选依赖。
  architecture:
    name: Architecture guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Layer boundaries R1-R5 / docstrings / file size / Any
        run: pytest tests/architecture -q

      - name: Startup cost
        run: python scripts/check_startup_cost.py --check

  python:
    name: Lint / Type / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      # 插件经 entry point 被发现，因此必须真的装进环境（D30 的两个示例、D31 的官方
      # openai-api、D32 的 anthropic、D33 的 discord、D34 的 feishu）。tests/e2e/ 的第一条
      # 用例会在没装时明确报出来。
      # **--no-deps 是刻意的**：平台 SDK（discord.py / lark-oapi）因此不在 CI 环境里，
      # 而两个 Channel 插件的测试树仍须全绿——这正是「只有一两个模块接触 SDK」换来的东西。
      - name: Install plugins
        run: |
          pip install --no-deps -e examples/plugins/nucleamind-plugin-echo-tool
          pip install --no-deps -e examples/plugins/nucleamind-plugin-session-memory
          pip install --no-deps -e plugins/nucleamind-plugin-openai-api
          pip install --no-deps -e plugins/nucleamind-plugin-anthropic
          pip install --no-deps -e plugins/nucleamind-plugin-discord
          pip install --no-deps -e plugins/nucleamind-plugin-feishu

      - name: Lint
        run: ruff check src/ plugins/ examples/ scripts/ tests/

      - name: Type check
        run: basedpyright

      - name: Test
        run: pytest
