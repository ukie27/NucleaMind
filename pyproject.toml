[project]
name = "nucleamind"
version = "0.3.0"
description = "A modular, pluggable Agent Kernel"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "NucleaMind contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

dependencies = [
    # 宿主的第三方依赖到此为止。`D35` 删掉 `legacy/` 之后，剩下的每一条都能指到一个
    # 具体的 import 点；**能力所需的包由那个能力自己的发行包声明**（`D32` 摘掉
    # `anthropic`、`D33` 摘掉 `discord.py`、`D34` 摘掉 `lark-oapi` 的同一条理由）。
    # 因此将来的 Memory / 扩展 Tool / Cron 插件即使需要 croniter 这类包，也不回到这里。
    "pydantic>=2.12.0,<3.0.0",      # sdk/manifest.py：PluginManifest
    "httpx>=0.28.0,<1.0.0",         # builtins/model_openai/、runtime/access/net
    # kernel/turn/invoker.py 与 kernel/plugins/loader.py：JSON Schema 校验
    # （技术方案 §10.2 第 10 步）。两处都惰性 import，但 Kernel 直接用它，必须显式声明。
    "jsonschema>=4.23.0,<5.0.0",
    "packaging>=24.0",              # sdk/manifest.py、sdk/version.py：SDK 版本区间
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.1.0",
    "basedpyright>=1.39.0,<2.0.0",
    # 根 conftest.py 的 Windows CA 夹具直接 import 它（此前只靠 httpx 的传递依赖）。
    "certifi>=2024.0.0",
    # 官方插件 openai-api / discord 的 HTTP 与 gateway 实现；插件自己声明为可选
    # 依赖，但它们的测试树与本仓库一起跑，因此开发环境要有。
    "aiohttp>=3.9.0,<4.0.0",
]

[project.scripts]
# `nm` is the only command; no `nanobot` alias is kept (technical design 4.5).
nm = "nucleamind.runtime.cli.main:app"

# Primary plugin discovery source (technical design 7.1). Official and
# third-party plugins register in the same group and share one load path.
# Empty until the plugin runtime lands in D25-D30.
[project.entry-points."nucleamind.plugins"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "src/nucleamind/**/*.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nucleamind"]

[tool.hatch.build.targets.sdist]
include = [
    "src/nucleamind/",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 基线规则集（全仓库）。`D35` 删掉 `legacy/` 之后没有豁免层了：scripts/ 与测试树的
# 豁免针对的是夹具与断言辅助，不是历史代码（技术方案 §12.1）。
# 沿用既有约定：不引入 `ruff format`。
select = ["E", "F", "I", "N", "W", "C901", "PLR0915", "TRY", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# 圈复杂度 ≤ 12（技术方案 §12.1）。
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# 一次性/运维脚本与测试：可读性阈值针对产品代码，不针对夹具与断言辅助。
# 插件是独立发行包，它们的测试树不在顶层 `tests/` 下，但适用同一条理由（`D33`）。
"scripts/**/*.py" = ["C901", "PLR0915", "TRY", "ASYNC"]
"tests/**/*.py" = ["C901", "PLR0915", "TRY", "ASYNC"]
"plugins/*/tests/**/*.py" = ["C901", "PLR0915", "TRY", "ASYNC"]
"examples/plugins/*/tests/**/*.py" = ["C901", "PLR0915", "TRY", "ASYNC"]

[tool.basedpyright]
include = ["src/nucleamind"]
exclude = ["**/tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# examples/plugins/ 各自带 tests/：示例插件是完整独立发行包，它们的契约测试
# 与本仓库一起跑（D30）。它们要求那两个包已 editable 装进环境。
testpaths = ["tests", "examples/plugins", "plugins"]

[tool.coverage.run]
source = ["src/nucleamind"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    # Protocol 与 TYPE_CHECKING 存根的函数体。它们永远不会被执行，
    # 计进分母只会逼人写「调用 `...` 一次」这种没有意义的测试。
    '^\s*\.\.\.$',
]
