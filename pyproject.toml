[project]
name = "nucleamind"
version = "0.3.0"
description = "A modular, pluggable Agent Kernel"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "NucleaMind contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    # Feishu's lark-oapi currently requires websockets<16; core supports 15 and 16.
    "websockets>=15.0,<17.0",
    "websocket-client>=1.9.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ddgs>=9.5.5,<10.0.0",
    "oauth-cli-kit>=0.1.6,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "lxml-html-clean>=0.4.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "croniter>=6.0.0,<7.0.0",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "questionary>=2.0.0,<3.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    # kernel/turn/invoker.py：工具参数的 JSON Schema 校验（技术方案 §10.2 第 10 步）。
    # 目前也是 mcp 的传递依赖，但 Kernel 直接用它，必须显式声明。
    "jsonschema>=4.23.0,<5.0.0",
    "chardet>=3.0.2,<6.0.0",
    "openai>=2.8.0",
    "tiktoken>=0.12.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "dulwich>=0.22.0,<1.0.0",
    "pyyaml>=6.0,<7.0.0",
    "filelock>=3.25.2",
    "watchfiles>=1.1.1,<2.0.0",
    "packaging>=24.0",
    "tzdata>=2025.2",
    "tzlocal>=5.3.1,<6.0.0",
    "defusedxml>=0.7.1,<1.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
api = [
    "aiohttp>=3.9.0,<4.0.0",
]
azure = [
    "azure-identity>=1.19.0,<2.0.0",
]
bedrock = [
    "boto3>=1.43.0",
]
documents = [
    # Compatibility extra: document readers are bundled since v0.2.3.
    "defusedxml>=0.7.1,<1.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
]
langfuse = [
    "langfuse>=3.0.0,<4.0.0",
]
pdf = [
    # Compatibility extra: PDF reading is bundled since v0.2.3.
    "pypdf>=5.0.0,<6.0.0",
]
olostep = [
    "olostep>=0.1.0; python_version < '3.14'",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.1.0",
    "basedpyright>=1.39.0,<2.0.0",
    "pymupdf>=1.25.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "python-socketio>=5.16.0,<6.0.0",
    "msgpack>=1.1.0,<2.0.0",
]

[project.scripts]
# `nm` is the only command; no `nanobot` alias is kept (technical design 4.5).
nm = "nucleamind.runtime.cli.main:app"

# Primary plugin discovery source (technical design 7.1). Official and
# third-party plugins register in the same group and share one load path.
# Empty until the plugin runtime lands in D25-D30.
[project.entry-points."nucleamind.plugins"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.custom]
# Implementation lives in the conventional `hatch_build.py` at the repo root.

[tool.hatch.build]
include = [
    "src/nucleamind/**/*.py",
    "src/nucleamind/legacy/templates/**/*.md",
    "src/nucleamind/legacy/skills/**/*.md",
    "src/nucleamind/legacy/skills/**/*.sh",
    "src/nucleamind/legacy/channels/*/webui/**/*",
    "src/nucleamind/legacy/web/dist/**/*",
]
# src/nucleamind/legacy/web/dist/ is produced by `cd webui && bun run build` and
# is git-ignored. List it as an artifact so hatch ships it in both wheel and
# sdist even though VCS does not track it.
artifacts = [
    "src/nucleamind/legacy/web/dist/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nucleamind"]
exclude = ["src/nucleamind/legacy/channels/*/tests/**"]

[tool.hatch.build.targets.sdist]
include = [
    "src/nucleamind/",
    "src/nucleamind/legacy/web/dist/",
    "hatch_build.py",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
]
exclude = ["src/nucleamind/legacy/channels/*/tests/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 基线规则集（全仓库）。新层与 plugins/ 在此之上叠加 C901 / PLR0915 / TRY / ASYNC，
# 由下面的 per-file-ignores 反向豁免 legacy/、scripts/ 与 tests/（技术方案 §12.1）。
# 沿用既有约定：不引入 `ruff format`。
select = ["E", "F", "I", "N", "W", "C901", "PLR0915", "TRY", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# 圈复杂度 ≤ 12（技术方案 §12.1）。
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# legacy/ 是隔离区，不追溯适用新层规范；它的收敛由债务棘轮度量，
# 而不是靠给历史代码打满告警。D31 删除 legacy/ 时一并删除本条。
"src/nucleamind/legacy/**/*.py" = ["C901", "PLR0915", "TRY", "ASYNC"]
# 一次性/运维脚本与测试：可读性阈值针对产品代码，不针对夹具与断言辅助。
"scripts/**/*.py" = ["C901", "PLR0915", "TRY", "ASYNC"]
"tests/**/*.py" = ["C901", "PLR0915", "TRY", "ASYNC"]

[tool.basedpyright]
include = ["src/nucleamind"]
exclude = ["**/tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# examples/plugins/ 各自带 tests/：示例插件是完整独立发行包，它们的契约测试
# 与本仓库一起跑（D30）。它们要求那两个包已 editable 装进环境。
testpaths = ["tests", "src/nucleamind/legacy/channels", "examples/plugins", "plugins"]

[tool.coverage.run]
source = ["src/nucleamind"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    # Protocol 与 TYPE_CHECKING 存根的函数体。它们永远不会被执行，
    # 计进分母只会逼人写「调用 `...` 一次」这种没有意义的测试。
    '^\s*\.\.\.$',
]
