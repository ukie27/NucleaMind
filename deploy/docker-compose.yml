x-common-config: &common-config
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      NANOBOT_CHANNELS: ${NANOBOT_CHANNELS:-whatsapp}
  volumes:
    - ~/.nucleamind:/home/nanobot/.nucleamind
  cap_drop:
    - ALL

# `D31` 之后容器里跑的是新 Kernel（`nm`），遗留 gateway / WebUI 已随 `legacy/webui/`
# 一并删除。这里因此只剩两个服务：常驻的 `nm serve` 与交互式的 `nm run`。
# `nm serve` 服务的是**已启用的 Channel 插件**，OpenAI 兼容接口来自 openai-api 插件
# （镜像里没有默认装它，需要在自己的镜像层里 pip install 并写进 plugins.enabled）。
services:
  nucleamind-serve:
    container_name: nucleamind-serve
    <<: *common-config
    command: ["serve", "--host", "0.0.0.0"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8760:8760
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nucleamind-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["run"]
    stdin_open: true
    tty: true
